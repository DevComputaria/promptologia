name: grimorio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrato do grimório
        run: python3 ferramentas/cli/check_grimorio.py
