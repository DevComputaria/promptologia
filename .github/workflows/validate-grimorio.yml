name: Validar grimório

on:
  pull_request:
  push:
    branches: [main]

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar metadados e índice
        run: python3 scripts/index-grimorio.py --check
